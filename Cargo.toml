[package]
name = "xenith"
version = "0.1.0"
edition = "2024"

[dependencies]
# Diagnostics
strsim = "0.11.1"
colored = "2.1"

# REPL
rustyline = "14.0"
dirs = "6.0.0"

# Language server (xenith-lsp binary only)
tokio = { version = "1.52.2", features = ["full"] }
tower-lsp = "0.20.0"
dashmap = "6.1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "xenith"
path = "src/main.rs"
